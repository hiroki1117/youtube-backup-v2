name: Set up Atlas
description: Install the pinned Atlas Community Edition CLI after verifying its checksum.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ATLAS_VERSION: v1.3.0
        ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b
      run: |
        curl -sSfL -o atlas "https://release.ariga.io/atlas/atlas-community-linux-amd64-${ATLAS_VERSION}"
        echo "${ATLAS_SHA256}  atlas" | sha256sum --check
        sudo install atlas /usr/local/bin/atlas
        rm atlas
