name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# team-practices の CI 品質ゲート（全チェックが merge をブロック）。
# フィードバック目標 10 分以内。pnpm store をキャッシュして高速化する。
defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
        # packageManager フィールドから pnpm バージョンを解決（corepack 連携）

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Test + coverage (line >= 80%)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  # Storybook ビルドゲート（team-practices: 既存ゲートと並列の別ジョブ、merge をブロック）。
  # tsc / vite build が検証しない Storybook ランタイム側のバンドル整合（main.ts 設定・addon 登録・
  # デコレータ合成・MSW 初期化・static asset）を検証する。
  # 実 VITE_* は注入しない（Storybook は MSW モックで完結。値は .storybook/main.ts の define で固定）。
  # 成果物 storybook-static/ は CI アーティファクトのみで、prod S3 へは配信しない（deploy.yml は dist/ のみ）。
  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload storybook-static
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 7
          if-no-files-found: ignore

  sources:
    name: Backend and batch source checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -c backend/requirements.lock -e "backend[dev]"
      - run: make backend batch
      - run: make -C backend export
      - run: git diff --exit-code -- openapi/openapi.json

  backend-package:
    name: Backend ZIP (shared by all Lambdas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements.lock -e '.[dev]'
      - run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: backend
          path: backend/build/backend.zip
          retention-days: 7
