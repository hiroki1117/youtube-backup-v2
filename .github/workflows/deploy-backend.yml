name: Deploy backend (prod Lambda)

# infra が作成した 5 関数へ共通 ZIP を配布する。関数の設定（handler/runtime/env/role）は infra が所有し、
# このワークフローは code と発行 version だけを扱う。
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC → AWS IAM role の AssumeRole 用
  contents: read

jobs:
  deploy:
    name: Build ZIP and update Lambda code
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      # 関数名 → 期待 handler（backend/build_lambda.py の HANDLERS と一致させる）
      FUNCTIONS: |
        youtube-backup-api-video entrypoints.video.handler
        youtube-backup-api-backup entrypoints.backup.handler
        youtube-backup-video-upload-complete entrypoints.s3_complete.handler
        youtube-backup-scrapbox-scan entrypoints.scrapbox_scan.handler
        youtube-backup-retry entrypoints.retry.handler
        youtube-backup-api-comments entrypoints.comments.handler
        youtube-backup-youtube-comments-ingest entrypoints.youtube_comments.handler
        youtube-backup-comments-backfill entrypoints.comments_backfill.handler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install and test
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c requirements.txt -e '.[dev]'
          .venv/bin/python -m ruff check .
          .venv/bin/python -m pytest -q

      - name: Build ZIP
        working-directory: backend
        run: make package

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # frontend 用とは別の、Lambda コード更新だけを許可する role を指定する
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify infra-managed handler settings
        run: |
          status=0
          while read -r name expected; do
            [ -z "$name" ] && continue
            actual=$(aws lambda get-function-configuration --function-name "$name" --query Handler --output text)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name handler is '$actual', expected '$expected' (infra-managed; fix in infra, not here)"
              status=1
            fi
          done <<< "$FUNCTIONS"
          exit $status

      - name: Update function code and publish versions
        run: |
          {
            echo "| Function | Version | CodeSha256 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name _; do
            [ -z "$name" ] && continue
            aws lambda update-function-code \
              --function-name "$name" \
              --zip-file fileb://backend/build/backend.zip \
              --publish \
              --query '[Version,CodeSha256]' --output text > result.txt
            aws lambda wait function-updated-v2 --function-name "$name"
            read -r version sha < result.txt
            echo "| $name | $version | $sha |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$FUNCTIONS"
