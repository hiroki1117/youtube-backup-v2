name: Deploy batch (prod ECR image)

# yt-dlp のバッチ用イメージを build して infra 管理の ECR リポジトリへ push する。
# Batch のジョブ定義は `:latest` を参照するため、push だけで次回のジョブから新イメージが使われる。
# リポジトリ・ジョブ定義・IAM は infra が所有し、このワークフローはイメージだけを扱う。
on:
  push:
    branches: [main]
    paths:
      - "batch/scripts/yt-dlp-script/**"
      - ".github/workflows/deploy-batch.yml"
  workflow_dispatch:

concurrency:
  group: deploy-batch-prod
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC → AWS IAM role の AssumeRole 用
  contents: read

jobs:
  deploy:
    name: Build and push yt-dlp image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      ECR_REPOSITORY: youtube-downloader-ytdlp
      IMAGE_CONTEXT: batch/scripts/yt-dlp-script
    steps:
      - uses: actions/checkout@v7

      - name: Check scripts
        working-directory: batch
        run: sh -n scripts/yt-dlp-script/main.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Lambda / frontend 用とは別の、ECR push だけを許可する role を指定する
          role-to-assume: ${{ secrets.AWS_BATCH_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$image:$GITHUB_SHA" -t "$image:latest" "$IMAGE_CONTEXT"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "| Repository | Tag | Digest |"
            echo "|---|---|---|"
            echo "| $ECR_REPOSITORY | $GITHUB_SHA, latest | $digest |"
          } >> "$GITHUB_STEP_SUMMARY"
