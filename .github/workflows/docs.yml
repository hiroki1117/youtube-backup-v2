name: Documentation

on:
  push:
    branches: [main]
    paths: ["frontend/**", "openapi/**", "db/**", "docs/site/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "openapi/**", "db/**", "docs/site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Republish Pages from main (default: build artifact only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            docs/site/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir docs/site install --frozen-lockfile --ignore-scripts
      # Storybook fixes VITE_* to synthetic values; no production variables or secrets.
      - run: pnpm --dir frontend build-storybook
      # The ERD reads a throwaway database built from db/migrations, never Neon.
      - uses: ./.github/actions/setup-dbmate
      - run: dbmate --no-dump-schema migrate
        env:
          DATABASE_URL: postgresql://postgres:docs@localhost:5432/postgres?sslmode=disable
      - name: Build ERD
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p build
          # pg_dump's \restrict lines are psql commands, which the ERD parser cannot read.
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres --schema-only --no-owner \
            --no-privileges --exclude-table=schema_migrations postgres |
            sed -E '/^\\(un)?restrict /d' > build/schema.sql
          pnpm --dir docs/site exec liam erd build --format postgres \
            --input ../../build/schema.sql --output-dir ../../build/erd
      - run: node docs/site/build.mjs
      - run: test -f build/docs/erd/schema.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

  publish:
    if: >-
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
