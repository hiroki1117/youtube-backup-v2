[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-backup-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "mangum>=0.19,<1",
  "boto3>=1.40,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "uvicorn>=0.35,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "entrypoints*", "usecases*", "repositories*", "wiring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
